name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Formula + renderer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Unit tests (render_homebrew_formula)
        run: python3 -m unittest scripts.test_render_homebrew_formula -v

      - name: Static formula + archive staging contract
        run: python3 scripts/check_formula.py

  brew-install:
    name: brew install + test (Linux)
    runs-on: ubuntu-latest
    needs: check
    steps:
      # setup-homebrew taps this repo as tonythethompson/numan (no separate
      # actions/checkout: the action checks out the PR into the tap path).
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # master

      - name: Install and test formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -euo pipefail
          # Homebrew rejects absolute Formula paths; install via the tap name.
          brew install --verbose tonythethompson/numan/numan
          brew test numan
          numan --version

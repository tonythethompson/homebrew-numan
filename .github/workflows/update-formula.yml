name: Update numan formula

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Numan release tag (v*.*.*)
        required: true
        type: string
  repository_dispatch:
    types: [numan-release]

permissions:
  contents: write

jobs:
  update:
    name: Render and push Formula/numan.rb
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
      NUMAN_REPO: tonythethompson/numan
    steps:
      - name: Verify tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::RELEASE_TAG must be v-prefixed SemVer (got: ${RELEASE_TAG:-<empty>})"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download SHA256SUMS and render formula
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$NUMAN_REPO" --pattern SHA256SUMS
          # Intel Mac (x86_64-apple-darwin) is intentionally not shipped.
          for triple in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            asset="numan-${VERSION}-${triple}.tar.gz"
            gh release view "$RELEASE_TAG" --repo "$NUMAN_REPO" --json isDraft,assets \
              | jq -e --arg asset "$asset" \
                '.isDraft == false and any(.assets[]; .name == $asset and .state == "uploaded")' \
                >/dev/null
          done
          python3 scripts/render_homebrew_formula.py \
            --version "$VERSION" \
            --sha256sums SHA256SUMS \
            --write \
            --out Formula/numan.rb

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/numan.rb
          if git diff --cached --quiet; then
            echo "Formula already at numan ${VERSION}"
            exit 0
          fi
          git commit -m "numan ${VERSION}"
          git push
